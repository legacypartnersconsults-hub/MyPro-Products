name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Add custom domain and SPA fallback
        run: |
          cp CNAME dist/CNAME
          cp dist/index.html dist/404.html
          # Serve /readyhub with a real 200 (not just via the 404.html fallback),
          # since it is the URL given to the app stores.
          mkdir -p dist/readyhub
          cp dist/index.html dist/readyhub/index.html
          mkdir -p dist/readyhub/brand-assets
          cp dist/index.html dist/readyhub/brand-assets/index.html
          # MyPro Products brand assets page, linked from the site footer.
          mkdir -p dist/brand
          cp dist/index.html dist/brand/index.html
          # MyPro Market brand assets page, linked from the Market page footer.
          # Creating dist/market makes Pages redirect /market to /market/, so the
          # Market page itself is served from market/index.html too.
          mkdir -p dist/market/brand
          cp dist/index.html dist/market/index.html
          cp dist/index.html dist/market/brand/index.html
          # MyPro Claim Assist product page.
          mkdir -p dist/claimassist/brand
          cp dist/index.html dist/claimassist/index.html
          # MyPro Claim Assist brand assets page, linked from its footer.
          cp dist/index.html dist/claimassist/brand/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000