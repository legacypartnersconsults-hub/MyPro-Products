<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPro Products | Unified Claims & Dispatch Suite</title>
  </head>
  <body>
    <div id="root" style="min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; padding: 24px; box-sizing: border-box;">
      <div style="max-width: 720px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);">
        <h1 style="margin: 0 0 10px; font-size: 1.25rem;">MyPro Products</h1>
        <p style="margin: 0 0 8px; line-height: 1.5;">
          This app must be served by a web server and cannot be opened directly as a file.
        </p>
        <p style="margin: 0; line-height: 1.5;">
          Run <strong>npm install</strong> then <strong>npm run dev</strong>, and open <strong>http://localhost:3000</strong>.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
